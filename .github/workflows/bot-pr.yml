name: "Bot PR Creator"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch de origem (head branch)"
        required: true
        type: string
      title:
        description: "Título do Pull Request"
        required: true
        type: string
      body:
        description: "Descrição do Pull Request"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    name: "Abrir Pull Request pelo GitHub App"
    runs-on: ubuntu-latest
    steps:
      - name: "Gerar Token do GitHub App (sosp-agents-bot)"
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SOSP_BOT_APP_ID }}
          private-key: ${{ secrets.SOSP_BOT_PRIVATE_KEY }}

      - name: "Checkout do Repositório"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: "Assegurar Autoria do Último Push pelo Bot"
        run: |
          git config user.name "sosp-agents-bot[bot]"
          git config user.email "sosp-agents-bot[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(ci): assinatura de envio pelo sosp-agents-bot" || true
          git push origin "${{ inputs.branch }}"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: "Criar Pull Request Oficial pelo Bot"
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Verifica se já existe PR aberto para esta branch
          EXISTING_PR=$(gh pr list --head "${{ inputs.branch }}" --base develop --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR já existe para a branch ${{ inputs.branch }}."
            gh pr edit "$EXISTING_PR" --title "${{ inputs.title }}" --body "${{ inputs.body }}"
            echo "pr_url=https://github.com/${{ github.repository }}/pull/$EXISTING_PR" >> "$GITHUB_OUTPUT"
          else
            PR_URL=$(gh pr create \
              --base develop \
              --head "${{ inputs.branch }}" \
              --title "${{ inputs.title }}" \
              --body "${{ inputs.body }}" \
              --reviewer "euoluizg")
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "Pull Request criado com sucesso: $PR_URL"
          fi
