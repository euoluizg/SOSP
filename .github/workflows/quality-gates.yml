name: "Quality Gates SOSP"

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality-gate:
    name: "Frontend Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout do Código"
        uses: actions/checkout@v4

      - name: "Configurar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "portal/package-lock.json"

      - name: "Instalar Dependências Frontend"
        run: |
          cd portal
          npm ci

      - name: "Verificação de Tipagem TypeScript (0 erros)"
        run: |
          cd portal
          npm run typecheck

      - name: "Testes Unitários e de Componentes (Vitest)"
        run: |
          cd portal
          npm test

      - name: "Build de Produção Next.js 15 (24 rotas)"
        run: |
          cd portal
          npm run build

  backend-quality-gate:
    name: "Backend Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout do Código"
        uses: actions/checkout@v4

      - name: "Configurar Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: "Instalar Dependências Backend"
        run: |
          pip install -r backend/requirements.txt

      - name: "Django System Checks"
        run: |
          cd backend
          python manage.py check

      - name: "Testes de APIs, Regras de Negócio e Segurança (Pytest)"
        run: |
          cd backend
          pytest -v

  integration-quality-gate:
    name: "Integration Quality Gate"
    runs-on: ubuntu-latest
    needs: [frontend-quality-gate, backend-quality-gate]
    steps:
      - name: "Checkout do Código"
        uses: actions/checkout@v4

      - name: "Configurar Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Instalar Dependências"
        run: |
          pip install -r backend/requirements.txt

      - name: "Executar Verificações de Integração HTTP e Contratos"
        run: |
          cd backend
          pytest -v common/ apps/scheduling/ apps/catalog/ apps/accounts/

  security-quality-gate:
    name: "Security Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout do Código"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Verificação de Segredos (Gitleaks)"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Auditoria de Dependências NPM"
        run: |
          cd portal
          npm audit --audit-level=critical

  bot-auth-gate:
    name: "Bot Authentication Gate"
    runs-on: ubuntu-latest
    steps:
      - name: "Gerar Token do GitHub App (sosp-agents-bot)"
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SOSP_BOT_APP_ID }}
          private-key: ${{ secrets.SOSP_BOT_PRIVATE_KEY }}

      - name: "Verificar Acesso e Permissões do GitHub App"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          REPO_NAME=$(gh api /installation/repositories --jq '.repositories[0].full_name')
          echo "Token do GitHub App gerado com sucesso! Acesso concedido ao repositório: $REPO_NAME"
          # Validação de leitura de Pull Requests conforme contexto de execução
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "Contexto de Pull Request detectado (PR #${{ github.event.pull_request.number }})."
            gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json number,title,state
          else
            echo "Contexto de push/workflow_dispatch detectado. Listando PRs abertos..."
            gh pr list --repo ${{ github.repository }} --limit 1
          fi
